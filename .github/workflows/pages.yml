name: Publish browser assessment to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check browser modules
        run: |
          node --check web/evaluator.mjs
          node --check web/app.mjs
          node --test tests/test_web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published site assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$base/" | grep -q 'Crypto hardware telemetry'
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$base/app.mjs" | grep -q 'evaluateTelemetry'
          curl -fsSL --retry 12 --retry-delay 5 --retry-all-errors "$base/evaluator.mjs" | grep -q 'export function evaluateTelemetry'
